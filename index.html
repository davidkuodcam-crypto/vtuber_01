<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>AI VTuber - 數位系校內展 (Voice Enabled)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* 全域設定：確保邊框計算不影響寬度 */
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden; /* 禁止捲動 */
        /* 修改：改為亮金色漸層背景，突顯黑色衣服 */
        background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 50%, #ffe0b2 100%);
        font-family: "Noto Sans TC", sans-serif;
        overscroll-behavior: none; 
        width: 100vw;
        height: 100vh;
        /* 解決 Safari/Chrome Mobile 高度問題 */
        height: 100dvh; 
    }
    
    /* 讀取畫面 */
    #loading-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.95);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
        transition: opacity 0.5s ease;
    }
    
    .loader {
        border: 4px solid #fff3e0;
        border-top: 4px solid #d32f2f;
        border-radius: 50%;
        width: 40px; height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 15px;
    }

    .loading-text { color: #d32f2f; font-size: 1rem; font-weight: bold; margin-bottom: 20px; }

    #start-btn {
        padding: 12px 30px;
        font-size: 1.1rem;
        background: linear-gradient(to right, #d32f2f, #f44336);
        color: #ffd700;
        border: 2px solid #ffd700;
        border-radius: 50px;
        cursor: pointer;
        display: none;
        box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
        transition: transform 0.2s, background 0.2s;
        font-weight: bold;
        text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        /* Android 觸控優化 */
        touch-action: manipulation; 
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }
    #start-btn:active { transform: scale(0.95); background: #b71c1c; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* API 狀態 (右上角) */
    #api-status {
        position: absolute;
        top: 15px; right: 15px;
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(4px);
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        color: #333; /* 修改：改為一般黑色/深灰色 */
        display: flex; align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        z-index: 100;
        transition: all 0.3s;
        border: 1px solid #ffcc80;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ccc; margin-right: 6px; }
    .status-connected { background-color: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
    .status-error { background-color: #e74c3c; box-shadow: 0 0 5px #e74c3c; }
    .status-preview { background-color: #f39c12; box-shadow: 0 0 5px #f39c12; }

    /* 檔案讀取狀態面板 */
    #file-status {
        position: absolute;
        top: 15px; left: 15px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(4px);
        border-radius: 12px;
        font-size: 12px;
        color: #5d4037;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        z-index: 100;
        max-width: 180px;
        transition: opacity 0.5s;
        pointer-events: none;
        border: 1px solid #ffcc80;
    }
    .file-status-item { 
        margin-bottom: 4px; 
        display: flex; 
        align-items: center; 
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .file-status-item:last-child { margin-bottom: 0; }
    .icon-ok { color: #2e7d32; margin-right: 6px; font-weight: bold; }
    .icon-fail { color: #c62828; margin-right: 6px; font-weight: bold; }
    .icon-loading { color: #ef6c00; margin-right: 6px; animation: pulse 1s infinite; }
    
    /* Android 除錯面板 */
    #tts-debug {
        position: absolute;
        top: 120px; /* 位於其他狀態下方 */
        left: 10px;
        background: rgba(0, 0, 0, 0.85);
        color: #00ff00; /* 駭客綠，方便閱讀 */
        font-family: "Courier New", monospace;
        font-size: 11px;
        padding: 10px;
        border-radius: 8px;
        width: 280px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 9999;
        pointer-events: none; /* 點擊穿透 */
        display: none; /* 預設隱藏，JS 偵測到 Android 才開啟 */
        border: 2px solid #00ff00;
        line-height: 1.4;
        white-space: pre-wrap;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* 瀏覽器不支援警告 */
    #browser-warning {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 235, 59, 0.95);
        color: #b71c1c;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
        z-index: 10000;
        display: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        border: 2px solid #f57f17;
        width: 80%;
        max-width: 400px;
    }
    #browser-warning h3 { margin-top: 0; }
    #browser-warning button {
        margin-top: 15px;
        padding: 8px 16px;
        background: #b71c1c;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
    }

    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

    /* 對話介面 */
    #chat-container {
        position: absolute; 
        /* 修改：提高底部距離，並加入安全區域，防止被手機導覽列遮擋 */
        bottom: 30px; 
        bottom: calc(30px + env(safe-area-inset-bottom));
        left: 50%; 
        transform: translateX(-50%);
        width: 90%; 
        max-width: 600px;
        display: flex; 
        flex-direction: column; 
        gap: 8px;
        z-index: 100;
        transition: bottom 0.3s;
    }

    @media (max-width: 600px) {
        #chat-container {
            width: 95%; 
            /* 手機版稍微再高一點 */
            bottom: 40px; 
            bottom: calc(40px + env(safe-area-inset-bottom));
        }
        #file-status, #api-status {
            top: 10px;
            transform: scale(0.9); 
            transform-origin: top;
        }
        #file-status { left: 10px; }
        #api-status { right: 10px; }
    }

    #chat-display {
        background: rgba(255, 255, 255, 0.1); /* ⭐ 改回半透明，並大幅提高透明度 (數值越小越透明) */
        padding: 12px; 
        border-radius: 16px;
        height: 140px; 
        overflow-y: auto;
        backdrop-filter: blur(4px); /* ⭐ 加回毛玻璃效果 */
        -webkit-backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 215, 0, 0.6);
        display: flex;
        flex-direction: column;
        gap: 8px;
        scrollbar-width: none; 
        -ms-overflow-style: none;
    }
    #chat-display::-webkit-scrollbar { display: none; }

    .message {
        padding: 8px 12px;
        border-radius: 12px;
        max-width: 85%;
        word-wrap: break-word;
        font-size: 14px;
        line-height: 1.5;
        color: white;
        text-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }

    .message-user { 
        align-self: flex-end; 
        background-color: rgba(30, 136, 229, 0.3); 
        border-bottom-right-radius: 2px; 
        color: #fff;
    }
    .message-ai { 
        align-self: flex-start; 
        background-color: rgba(255, 255, 255, 0.3); 
        border-bottom-left-radius: 2px; 
        color: #000000; 
        text-shadow: none;
        border: 1px solid #ffd700;
    }
    .message-system { align-self: center; background: transparent; color: #e65100; font-size: 12px; font-style: italic; text-shadow: none; text-align: center;}

    .message a { color: #1e88e5; text-decoration: none; border-bottom: 1px dotted #1e88e5; }
    .message-user a { color: #bbdefb; } /* 修改：使用者訊息內的連結顏色 */

    #input-area { 
        display: flex; 
        gap: 8px; 
        align-items: center; 
        width: 100%; /* 確保滿版 */
        position: relative; /* 為了定位語音波動條 */
    }
    
    /* 輸入框容器，用於包裹 input 與語音波動條 */
    .input-wrapper {
        position: relative;
        flex: 1;
        display: flex;
        min-width: 0;
    }

    #user-input {
        width: 100%;
        padding: 12px 16px; 
        border-radius: 25px; 
        border: 1px solid rgba(255, 215, 0, 0.6);
        outline: none;
        background: rgba(255, 255, 255, 0.95); 
        font-size: 16px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        color: #5d4037;
        z-index: 2; /* 確保文字在波動條上方 */
        background-color: transparent; /* 讓背景透明以顯示波動條 */
        background: rgba(255, 255, 255, 0.95);
    }
    #user-input::placeholder { color: #999; }

    /* ⭐⭐⭐ 語音波動條樣式 ⭐⭐⭐ */
    #voice-overlay {
        position: absolute;
        bottom: 1px;
        left: 20px; /* 配合 border-radius */
        right: 20px;
        height: 3px;
        background-color: #3b82f6;
        z-index: 3;
        display: none; /* 預設隱藏 */
        pointer-events: none;
        animation: voice-pulse 1.5s infinite;
    }
    @keyframes voice-pulse { 0%, 100% { opacity: 0.5; transform: scaleX(0.95); } 50% { opacity: 1; transform: scaleX(1); } }

    #send-btn {
        padding: 0 20px; 
        height: 44px; 
        border-radius: 22px; border: none;
        background: linear-gradient(to right, #1976d2, #1565c0); /* 修改：藍色漸層 */
        color: #fff; /* 修改：文字白色 */
        font-weight: bold; cursor: pointer;
        transition: background 0.2s;
        box-shadow: 0 4px 10px rgba(21, 101, 192, 0.3); /* 修改：藍色陰影 */
        flex-shrink: 0;
        border: 1px solid #90caf9; /* 修改：邊框顏色 */
        /* Android 觸控優化 */
        touch-action: manipulation; 
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { background: #bdbdbd; box-shadow: none; cursor: not-allowed; border: none; color: #fff;}

    /* 按鈕共用樣式 */
    .control-btn {
        width: 44px; height: 44px; border-radius: 50%; border: none;
        background: rgba(255, 255, 255, 0.95); font-size: 20px; cursor: pointer;
        display: flex; justify-content: center; align-items: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        flex-shrink: 0;
        border: 1px solid #ffd700;
        color: #d32f2f;
        transition: all 0.2s; /* 增加過渡效果 */
        /* Android 觸控優化 */
        touch-action: manipulation; 
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }
    .control-btn:active { transform: scale(0.95); }
    #mute-btn.muted { background: #e74c3c; color: white; border: none; }
    
    /* 修改：跳舞按鈕按下狀態的樣式 */
    #dance-btn { color: #e91e63; } 
    #dance-btn.active {
        background: #e91e63; /* 按下變深粉紅 */
        color: white;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        border-color: #c2185b;
    }

    /* ⭐⭐⭐ 麥克風錄音動畫 ⭐⭐⭐ */
    .recording-pulse {
        animation: pulse-ring 2s infinite;
        background-color: #ef4444 !important; /* 紅色背景 */
        color: white !important;
        border: none !important;
    }
    @keyframes pulse-ring {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
        70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    
    #emotion-debug {
        position: absolute; top: 60px; right: 15px;
        font-size: 10px; color: #5d4037;
        background: rgba(255,255,255,0.7);
        padding: 4px 8px; border-radius: 6px;
        pointer-events: none;
        backdrop-filter: blur(2px);
        text-align: right;
        line-height: 1.3;
        opacity: 0.6; 
    }

    /* ⭐⭐⭐ 新增：動作指令監控面板 (Action Debug Panel) ⭐⭐⭐ */
    #action-debug-panel {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #00ffcc; /* 螢光綠色，方便錄影時看清楚 */
        font-family: "Courier New", monospace;
        font-size: 11px;
        padding: 10px;
        border-radius: 8px;
        width: 60%;
        max-width: 500px;
        max-height: 120px;
        overflow-y: auto;
        z-index: 10000;
        pointer-events: auto; /* 允許滾動 */
        border: 1px solid #00ffcc;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);

        /* 加入以下這四行來隱藏它 */
        top: -9999px; 
        left: -9999px;
        opacity: 0;
        pointer-events: none;
    }
    @media (max-width: 600px) {
        #action-debug-panel {
            width: 90%;
            top: 40px; /* 手機版往下挪一點避免與其他狀態重疊 */
        }
    }

    /* ⭐⭐⭐ 新增：歌詞字幕樣式 ⭐⭐⭐ */
    #lyrics-container {
        position: absolute;
        top: 5%; /* 放置在畫面偏上方，避免擋住角色 */
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        text-align: center;
        pointer-events: none; /* 讓滑鼠點擊可以穿透到後方的 3D 場景 */
        z-index: 99;
        font-size: 22px;
        font-weight: 900;
        color: #ffffff;
        text-shadow: 
            2px 2px 0 #000, 
            -2px -2px 0 #000, 
            2px -2px 0 #000, 
            -2px 2px 0 #000,
            0px 4px 10px rgba(0,0,0,0.8);
        transition: opacity 0.3s ease;
        letter-spacing: 2px;
        opacity: 0; /* 預設為隱藏狀態 */
    }
    @media (max-width: 600px) {
        #lyrics-container {
            font-size: 18px;
            top: 15%;
        }
    }

</style>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://unpkg.com/@pixiv/three-vrm-animation@3.0.0/lib/three-vrm-animation.module.js"
    }
}
</script>
</head>

<body>

    <div id="loading-screen">
        <div class="loader" id="loader"></div>
        <div class="loading-text" id="status-text">初始化系統...</div>
        <button id="start-btn">慶祝數位系校內展</button>
    </div>

    <div id="browser-warning">
        <h3>⚠️ 瀏覽器功能限制</h3>
        <p>檢測到目前的瀏覽器 (例如 LINE/FB 內建瀏覽器) 不支援語音功能。</p>
        <p>請點擊右上角選單，選擇「在瀏覽器中開啟」 (Open in Chrome/Safari) 以獲得完整體驗。</p>
        <button onclick="document.getElementById('browser-warning').style.display='none'">我知道了 (繼續無聲模式)</button>
    </div>

    <div id="file-status">
        <div class="file-status-item"><span class="icon-loading">●</span> 系統啟動...</div>
    </div>

    <div id="api-status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-msg">連線中...</span>
    </div>
    
    <div id="tts-debug">TTS 系統診斷中...</div>
    
    <div id="emotion-debug">
        情緒: Neutral<br>
        動作: None
    </div>

    <div id="action-debug-panel">等待動作指令...</div>

    <div id="lyrics-container"></div>

    <div id="chat-container">
        <div id="chat-display">
            </div>
        <div id="input-area">
            <button id="dance-btn" class="control-btn" title="熱舞組曲">💃</button>
            <button id="mute-btn" class="control-btn" title="切換聲音">🔊</button>
            
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="請輸入訊息..." disabled>
                <div id="voice-overlay"></div>
            </div>

            <button id="mic-btn" class="control-btn" title="語音輸入"><i class="fa-solid fa-microphone"></i></button>

            <button id="send-btn" disabled>發送</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
        import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

        const API_URL = "/api/chat"; 
        
        // --- 偵測作業系統 ---
        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        // ⭐⭐⭐ 偵測是否為 LINE 或 Facebook 內建瀏覽器 ⭐⭐⭐
        const isLineApp = /Line/i.test(navigator.userAgent);
        const isFbApp = /FBAN|FBAV/i.test(navigator.userAgent);

        // Global flag for auto-resuming mic
        window.shouldResumeMic = false;
        window.pendingMicResume = false; // ⭐ 新增：用於標記跳舞結束後才啟動麥克風的排程

        // Android Debug Logger Setup
        const ttsDebug = document.getElementById('tts-debug');
        
        // 修正：如果偵測到是 Android，立刻顯示面板並寫入第一行 Log
        if (isAndroid) {
            // ttsDebug.style.display = 'block'; // 修改：隱藏除錯面板
            ttsDebug.innerHTML = "=== Android Debug Log (Init) ===<br>";
        }

        function logTTS(msg) {
            // 允許 Android/iOS 或強制開啟除錯時寫入
            if (!isAndroid && !isIOS) return;
            const time = new Date().toTimeString().split(' ')[0];
            // 採用 append 方式，新的訊息在最上方
            ttsDebug.innerHTML = `[${time}] ${msg}<br>` + ttsDebug.innerHTML;
        }

        // 立即測試 Log 功能
        logTTS("腳本載入... 檢查 API");

        // ⭐⭐⭐ 新增：動作監控寫入函式 ⭐⭐⭐
        function logAction(msg) {
            const panel = document.getElementById('action-debug-panel');
            if (panel) {
                const time = new Date().toTimeString().split(' ')[0];
                // 將新訊息加在最上方
                panel.innerHTML = `[${time}] ${msg}\n-------------------\n` + panel.innerHTML;
            }
        }

        // ⭐⭐⭐ 瀏覽器功能檢查與相容性修復 ⭐⭐⭐
        let ttsSupported = true;

        if (!window.speechSynthesis) {
            // 嘗試舊版前綴
            if (window.webkitSpeechSynthesis) {
                window.speechSynthesis = window.webkitSpeechSynthesis;
                window.SpeechSynthesisUtterance = window.webkitSpeechSynthesisUtterance;
                logTTS("⚠️ 使用 webkitSpeechSynthesis 相容模式");
            } else {
                logTTS("❌ 錯誤: 不支援 speechSynthesis");
                ttsSupported = false;
            }
        } else {
            logTTS("✅ 支援 speechSynthesis");
        }

        if (ttsSupported && !window.SpeechSynthesisUtterance) {
             logTTS("❌ 錯誤: 不支援 SpeechSynthesisUtterance");
             ttsSupported = false;
        } else if (ttsSupported) {
             logTTS("✅ 支援 SpeechSynthesisUtterance");
        }

        // 如果不支援，顯示警告面板
        if (!ttsSupported && isAndroid) {
            document.getElementById('browser-warning').style.display = 'block';
            logTTS(">> 已顯示瀏覽器更換提示 <<");
        }

        // --- 載入單一角色模型 ---
        const VRM_MODELS = [
            'https://davidkuodcam-crypto.github.io/VTuber/AvatarSample_W.vrm' // 角色: W
        ];
        
        let currentVrms = []; 
        let mixers = [];      // 動畫混合器陣列
        let isDancing = false;
        
        // --- 舞步清單 ---

        function updateVoices() {
            if (!window.speechSynthesis) return;

            if (voices.length > 0) {
                // Android 優先策略：

                // 2. 任何繁體中文 (zh-TW)

                preferredVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang.includes('zh-TW')) && v.localService) ||

            for(let i = 0; i < particlesCount * 3; i+=3) {

                posArray[i+1] = Math.random() * 10;       // Y

                    colorArray[i] = 0.9;
                    colorArray[i+1] = 0.1;
                    colorArray[i+2] = 0.1;

                    colorArray[i] = 0.8;
                    colorArray[i+1] = 0.6;
                    colorArray[i+2] = 0.0;
                }
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
            
            const material = new THREE.PointsMaterial({

        async function loadExternalData() {
            const statusText = document.getElementById('status-text');

            let promptStatusHTML = '<span class="icon-loading">●</span> Prompt';
            let kbStatusHTML = '<span class="icon-loading">●</span> KB';

            const renderStatus = () => {
                fileStatusDiv.innerHTML = `
                    <div class="file-status-item">${promptStatusHTML}</div>
                    <div class="file-status-item">${kbStatusHTML}</div>
                `;
            };
            
            renderStatus();

            try {
                statusText.innerText = "讀取角色設定...";
                const res = await fetch(`./Prompt.txt?t=${Date.now()}`);
                if (res.ok) {
                    externalSystemPrompt = await res.text();
                    promptStatusHTML = '<span class="icon-ok">✓</span> Prompt OK';
                } else {
                    promptStatusHTML = '<span class="icon-fail">✗</span> Prompt Def';
                }
            } catch (e) {
                promptStatusHTML = '<span class="icon-fail">✗</span> Prompt Err';
            }
            renderStatus();

            statusText.innerText = "讀取雲端知識庫...";
            let fileIndex = 1;
            let keepLoading = true;
            let loadedCount = 0;
            
            while (keepLoading) {
                const fileNameRoot = `KnowledgeBase${String(fileIndex).padStart(2, '0')}.txt`;
                const fileNameFolder = `KnowledgeBase/KnowledgeBase${String(fileIndex).padStart(2, '0')}.txt`;
                
                kbStatusHTML = `<span class="icon-loading">●</span> 掃描 KB${String(fileIndex).padStart(2,'0')}...`;
                renderStatus();

                try {
                    let res = await fetch(`./${fileNameFolder}?t=${Date.now()}`);
                    let usedPath = fileNameFolder;
                    
                    if (!res.ok) {
                         // 嘗試從根目錄讀取
                         try {
                             const resRoot = await fetch(`./${fileNameRoot}?t=${Date.now()}`);
                             if (resRoot.ok) {
                                 res = resRoot;
                                 usedPath = fileNameRoot;
                             }
                         } catch(e) {}
                    }

                    if (res.ok) {
                        const text = await res.text();
                        if (text.trim().length > 0) {
                            if (fileIndex === 1) {
                                openingRemark = text;
                            }
                            externalKnowledge += `\n\n【KB: ${usedPath}】\n${text}`;
                            loadedCount++;
                            fileIndex++;
                        } else {
                            fileIndex++;
                        }
                    } else {
                        // 404 is expected when no more files
                        keepLoading = false;
                    }
                } catch (e) {
                    keepLoading = false;
                }
            }

            if (loadedCount > 0) {
                kbStatusHTML = `<span class="icon-ok">✓</span> KB x${loadedCount}`;
            } else {
                kbStatusHTML = `<span class="icon-fail">✗</span> No KB`;
            }
            renderStatus();
            statusText.innerText = "系統就緒！";
        }

        // --- 動畫 ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();
            const elapsedTime = clock.elapsedTime;

            // 粒子動畫 (緩緩飄落)
            if (particlesMesh) {
                particlesMesh.rotation.y += 0.001; // 整體旋轉
                const positions = particlesMesh.geometry.attributes.position.array;
                for(let i = 1; i < particlesCount * 3; i+=3) {
                    positions[i] -= 0.015; // 向下飄落
                    // 如果掉到地板以下，重置到上方隨機位置
                    if (positions[i] < 0) {
                        positions[i] = 10;
                    }
                }
                particlesMesh.geometry.attributes.position.needsUpdate = true;
            }

            // 更新所有 動畫混合器
            mixers.forEach(mixer => mixer.update(deltaTime));

            // 更新所有 VRM 角色
            currentVrms.forEach((vrm, index) => {
                if(!vrm) return; // 避免陣列有空洞
                vrm.update(deltaTime);
                
                // 如果沒有在跳舞，才執行自然的呼吸動作
                if (!isDancing) {
                    const isW = (index === 0);
                    let playBreathing = true;

                    // 有閒置或說話動作時不觸發預設呼吸，避免動作衝突
                    if (isW && (idleActionW || (isSpeaking && talkingActionW))) playBreathing = false;

                    if (playBreathing) {
                        const spine = vrm.humanoid.getNormalizedBoneNode('spine');
                        if (spine) {
                            spine.rotation.x = Math.sin(elapsedTime * 1.5) * 0.02;
                            spine.rotation.y = Math.sin(elapsedTime * 0.8) * 0.02;
                        }
                    }
                }

                // ⭐ 說話嘴型同步
                if (isSpeaking && !isMuted) {
                    if (index === 0) {
                        // 單人時，講話一律使用嘴型對嘴
                        const s = Math.sin(elapsedTime * 18); // 說話速度微調
                        vrm.expressionManager.setValue('aa', (s + 1) / 2 * 0.6);
                        
                        if (isOpeningRemark) {
                            vrm.expressionManager.setValue('happy', 0.8);
                        }
                    }
                } else {
                    const currentVal = vrm.expressionManager.getValue('aa');
                    vrm.expressionManager.setValue('aa', THREE.MathUtils.lerp(currentVal, 0, 0.2));
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 眨眼動畫
        function startBlinking(vrm) {
            if(!vrm) return;
            const blinkLoop = () => {
                if (!window.actionActive) {
                    setTimeout(() => {
                        vrm.expressionManager.setValue('blink', 1);
                        setTimeout(() => {
                            vrm.expressionManager.setValue('blink', 0);
                            blinkLoop();
                        }, 120);
                    }, Math.random() * 3000 + 2000); 
                } else {
                    setTimeout(blinkLoop, 1000);
                }
            };
            blinkLoop();
        }

        // --- 跳舞邏輯 (回合制) ---
        const danceBtn = document.getElementById('dance-btn');
        
        // 輔助函式：陣列洗牌
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 核心邏輯：產生該回合的動作順序
        function generateSequences(round) {
            vrmDanceSequences = [];
            const baseSequence = [0, 1, 2, 3]; // 對應 DANCE_URLS 的索引
            
            // 為單一角色產生動作表
            currentVrms.forEach(() => {
                if (round % 2 !== 0) {
                    vrmDanceSequences.push([...baseSequence]);
                } else {
                    vrmDanceSequences.push(shuffleArray([...baseSequence]));
                }
            });
            
            const mode = round % 2 !== 0 ? "Sequential" : "Random";
            console.log(`[Round ${round}] ${mode}`, vrmDanceSequences);
        }

        // ⭐⭐⭐ 終極防呆：嚴格管理 Three.js Mixer 的事件監聽器，防止記憶體洩漏與動作快轉 ⭐⭐⭐
        function assignMixerListener(vrm, index, listener) {
            if (!vrm || !vrm.userData.mixer) return;
            if (currentDanceListeners[index]) {
                vrm.userData.mixer.removeEventListener('finished', currentDanceListeners[index]);
            }
            currentDanceListeners[index] = listener;
            vrm.userData.mixer.addEventListener('finished', listener);
        }

        function clearAllMixerListeners() {
            currentVrms.forEach((vrm, i) => {
                if (vrm && vrm.userData.mixer && currentDanceListeners[i]) {
                    vrm.userData.mixer.removeEventListener('finished', currentDanceListeners[i]);
                }
                currentDanceListeners[i] = null;
            });
        }

        // ⭐⭐⭐ 修正：將載入邏輯獨立為 loadDanceAssets，以便 AI 指令呼叫 ⭐⭐⭐
        async function loadDanceAssets() {
            // 如果已經載入過動畫，直接返回
            if (danceActionsMap.length > 0) {
                return;
            }

            if (currentVrms.length === 0) return;

            addMessage("準備熱舞資料中...", "system");
            
            // 使用 Promise.all 一次載入所有舞步
            const promises = DANCE_URLS.map(url => new Promise((resolve, reject) => {
                loader.load(url, (gltf) => {
                     const vrmAnimations = gltf.userData.vrmAnimations;
                     if (vrmAnimations && vrmAnimations.length > 0) {
                         resolve(vrmAnimations[0]);
                     } else {
                         resolve(null);
                     }
                }, undefined, (e) => {
                    console.error("Dance Load Error:", url, e);
                    resolve(null); // 錯誤時回傳 null，避免卡死
                });
            }));

            const animationClips = await Promise.all(promises);
            // 過濾掉載入失敗的
            const validClips = animationClips.filter(c => c);
            
            if (validClips.length === 0) {
                addMessage("舞蹈載入失敗", "system");
                return;
            }

            // 為每個舞步、每個角色建立 Action
            validClips.forEach(clipData => {
                const actionsForThisDance = [];
                currentVrms.forEach(vrm => {
                    // FIX: 安全讀取 userData
                    if (!vrm || !vrm.userData || !vrm.userData.mixer) return;
                    
                    // 建立 Clip 與 Action
                    const clip = createVRMAnimationClip(clipData, vrm);
                    const action = vrm.userData.mixer.clipAction(clip);
                    actionsForThisDance.push(action);
                });
                danceActionsMap.push(actionsForThisDance);
            });
            
            addMessage("舞步載入完成，Let's Dance!", "system");
            console.log("Assets Loaded!");
        }

        // 修改後的按鈕邏輯：呼叫 loadDanceAssets 後再 startDance
        async function loadAndPlayDance() {
            await loadDanceAssets();
            if (danceActionsMap.length > 0) {
                startDance();
            }
        }

        // 開始跳舞流程
        function startDance() {
            isDancing = true;
            danceBtn.classList.add('active'); 
            
            // ⭐⭐⭐ 強制停止說話 (修正) ⭐⭐⭐
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
            }

            // 觸發動態運鏡
            updateCameraPosition();
            
            // 停止所有閒置和說話動作
            if (idleActionW) idleActionW.fadeOut(0.5); 
            if (talkingActionW) talkingActionW.fadeOut(0.5);
            
            // 播放 BGM
            bgm.currentTime = 0;
            bgm.muted = isMuted;
            
            // ⭐⭐⭐ FIX: 增強的 BGM 播放 (防止中斷錯誤) ⭐⭐⭐
            const playPromise = bgm.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error("BGM Play Error:", error);
                });
            }

            // 重置狀態到第 1 回合
            danceRound = 1;
            danceStepIndex = 0;

            // 產生第 1 回合的動作表
            generateSequences(danceRound);

            // 清理任何殘留的監聽器
            clearAllMixerListeners();

            // 開始播放
            playCurrentStep();
        }

        // ⭐⭐⭐ 手動跳舞按鈕引擎：全同步等待機制 ⭐⭐⭐
        function playCurrentStep() {
            if (!isDancing) return;

            let dancersFinished = [true]; // 單人版本預設
            let anyoneDancing = false;
            let stepTriggered = false; // ⭐ 加入單次鎖定，防止同步跳完時發生雙重觸發 Bug

            currentVrms.forEach((vrm, vrmIndex) => {
                if (!vrm || !vrm.userData.mixer) return;

                const moveIndex = vrmDanceSequences[vrmIndex][danceStepIndex];
                const action = danceActionsMap[moveIndex]?.[vrmIndex];
                const oldAction = currentActiveActions[vrmIndex];

                if (action) {
                    anyoneDancing = true;
                    dancersFinished[vrmIndex] = false; // 有動作的人標為未完成
                    
                    // ⭐ 核心修復：如果新舊動作不同，淡出舊的；如果相同，強制 Stop 重置，防止權重抵消卡死
                    if (oldAction && oldAction !== action) {
                        oldAction.fadeOut(0.5);
                    }

                    if (oldAction === action) {
                        action.stop(); // 停止先前的停格狀態
                        action.reset();
                        action.setEffectiveWeight(1); // 滿權重重啟
                        action.play();
                    } else {
                        action.reset();
                        action.setLoop(THREE.LoopOnce); 
                        action.clampWhenFinished = true; // ⭐ 完美停格等待：播完停在最後一幀定格
                        action.setEffectiveWeight(1);
                        action.fadeIn(0.5); 
                        action.play();
                    }
                    
                    currentActiveActions[vrmIndex] = action; // 記錄目前動作

                    // 為每個角色的 Mixer 獨立掛上一次性監聽器 (使用安全函式防止 Memory Leak)
                    const onFinished = (e) => {
                        if (e.action === action) {
                            if (currentDanceListeners[vrmIndex]) {
                                vrm.userData.mixer.removeEventListener('finished', currentDanceListeners[vrmIndex]);
                                currentDanceListeners[vrmIndex] = null;
                            }

                            if (!isDancing) return;
                            if (currentActiveActions[vrmIndex] !== action) return; // 忽略舊動作

                            dancersFinished[vrmIndex] = true; // 標記這個角色已跳完

                            if (dancersFinished.every(v => v) && !stepTriggered) {
                                stepTriggered = true; // 鎖定，防止同幀內的其他人再次觸發
                                
                                // 前進到下一步
                                danceStepIndex++;
                                if (danceStepIndex >= 4) {
                                    danceStepIndex = 0;
                                    danceRound++;
                                    generateSequences(danceRound);
                                    if (danceRound % 2 === 0) {
                                        addMessage(`Round ${danceRound}: Next Moves!`, "system");
                                    } else {
                                        addMessage(`Round ${danceRound}: Sequential Mode!`, "system");
                                    }
                                }
                                playCurrentStep();
                            }
                        }
                    };
                    assignMixerListener(vrm, vrmIndex, onFinished);
                } else {
                    currentActiveActions[vrmIndex] = null;
                }
            });

            // 防呆：如果完全沒人有動作，延遲後直接跳過
            if (!anyoneDancing && !stepTriggered) {
                stepTriggered = true;
                setTimeout(() => {
                    danceStepIndex++;
                    if (danceStepIndex >= 4) {
                        danceStepIndex = 0;
                        danceRound++;
                        generateSequences(danceRound);
                    }
                    playCurrentStep();
                }, 50);
            }
        }

        // 停止跳舞
        function stopDance() {
            if (!isDancing) return;
            
            isDancing = false;
            danceBtn.classList.remove('active');
            
            // 停止 BGM
            bgm.pause();
            bgm.currentTime = 0;
            
            // ⭐⭐⭐ 隱藏歌詞 ⭐⭐⭐
            const lyricsContainer = document.getElementById('lyrics-container');
            if (lyricsContainer) lyricsContainer.style.opacity = 0;
            
            // 停止所有動作
            danceActionsMap.forEach(group => {
                group.forEach(action => action.fadeOut(0.5));
            });
            // 停止可能被掛載為 Active 的 Idle 動作 (如果不是 Idle)
            currentActiveActions.forEach((action, i) => {
                let idleA = idleActionW;
                if (action && action !== idleA) action.fadeOut(0.5);
            });
            
            // ⭐⭐⭐ 徹底清除所有殘留的監聽器 ⭐⭐⭐
            clearAllMixerListeners();
            
            // ⭐⭐⭐ 清空佇列 ⭐⭐⭐
            currentDanceQueue = [];
            currentPlayingDanceData = null; 
            window.pendingMicResume = false; // 取消等待中的麥克風自動開啟任務
            
            // 重置相機
            setTimeout(() => {
                updateCameraPosition();
            }, 500);
            
            // ⭐ 確保 Stop 後絕對給予權重，防止回歸 Rest Pose
            if (idleActionW && currentActiveActions[0] !== idleActionW) {
                idleActionW.reset(); idleActionW.setEffectiveWeight(1); idleActionW.fadeIn(0.5).play();
            }

            currentActiveActions = [null]; // ⭐ 清空追蹤
        }

        function toggleDance() {
            if (isDancing) {
                stopDance();
            } else {
                loadAndPlayDance(); 
            }
        }

        // ⭐⭐⭐ 1️⃣ JSON 解析器（終極防呆破裂版：修復 AI 漏逗號的問題） ⭐⭐⭐
        function safeParseAIJson(text) {
            try {
                // 清除可能包含的 Markdown 標記
                let cleanText = text.replace(/```json/gi, '').replace(/```/g, '').trim();
                
                // 尋找 JSON 的起點與終點
                const start = cleanText.indexOf('{');
                const end = cleanText.lastIndexOf('}');
                if (start === -1 || end === -1) return null;
                
                let jsonStr = cleanText.substring(start, end + 1);
                
                // ⭐ 終極修復 1：把所有的真實換行符號替換成空格，避免字串內換行導致 JSON.parse 崩潰
                jsonStr = jsonStr.replace(/[\n\r]+/g, ' ');
                
                // ⭐ 終極修復 2 (拯救矩陣)：AI 常常忘記二維陣列中間的逗號，例如 [[1,2][3,4]]，幫它補上變成 [[1,2], [3,4]]
                jsonStr = jsonStr.replace(/\]\s*\[/g, '], [');
                
                // ⭐ 終極修復 3 (防止單引號搗亂)
                jsonStr = jsonStr.replace(/'/g, '"');
                
                // 修復常見壞 JSON
                jsonStr = jsonStr
                    .replace(/"dance_list"\s*:\s*,/g, '"dance_list":[],') // 修復空值
                    .replace(/,\s*}/g, '}') // 修復尾部逗號
                    .replace(/,\s*]/g, ']'); // 修復陣列尾部逗號
                    
                const result = JSON.parse(jsonStr);
                
                // 允許一維或二維陣列
                if (result.action === "dance_sequence") {
                    if (typeof result.dance_list === "number") {
                        result.dance_list = [result.dance_list];
                    }
                    if (!Array.isArray(result.dance_list) || result.dance_list.length === 0) {
                        result.dance_list = null; // 設為 null，讓 handleAIResponse 用文字猜測
                    } else {
                        // ⭐ 強制轉換所有元素為數字，防止 AI 塞文字進來
                        result.dance_list = result.dance_list.map(item => {
                            if (Array.isArray(item)) {
                                return item.map(v => parseInt(v)).map(v => isNaN(v) ? -1 : v);
                            } else {
                                let v = parseInt(item);
                                return isNaN(v) ? -1 : v;
                            }
                        });
                    }
                }
                return result;
            } catch (err) {
                console.warn("JSON 修復失敗:", err, "\nRaw text:", text);
                return null;
            }
        }

        // ⭐⭐⭐ 2️⃣ fallback：從文字猜舞蹈 ⭐⭐⭐
        function guessDanceFromText(text) {
            if (!text) return null;
            const lowerText = text.toLowerCase();
            
            // ⭐ 終極修復：優先判定「定格B」，避免被下方的「霹靂」關鍵字攔截變成 0
            if (lowerText.includes("定格b") || lowerText.includes("霹靂舞b")) {
                return [3];
            }

            const map = {
                "霹靂": 0, "街舞": 0, "hiphop": 0, "breakdance": 0,
                "wave": 1, "揮手": 1, "湯瑪斯": 1, "flair": 1, "thomas": 1,
                "嘻哈": 2, "律動": 2, "hip hop": 2,
                "跳舞": -1, "dance": -1, // Random
                "隨機跳": -1, "隨便跳": -1
            };
            for (const key in map) {
                if (lowerText.includes(key)) {
                    return [map[key]]; // 單次跳
                }
            }
            return null;
        }

        // ⭐⭐⭐ 新增：防呆過濾器，修正單一角色的跳舞陣列 ⭐⭐⭐
        function fixDanceSequence(seq, referenceText) {
            // 單人版本：如果 AI 給了 2D 陣列 (例如 [[1], [99], [99]])，直接取第一人的動作
            if (Array.isArray(seq) && seq.length > 0 && Array.isArray(seq[0])) {
                return seq[0];
            }
            return seq; 
        }

        // ⭐⭐⭐ 3️⃣ 修正版：播放舞蹈序列 ⭐⭐⭐
        async function playDanceSequence(sequence) {
            // 在 await 之前先將狀態設為 true
            isDancing = true;
            danceBtn.classList.add('active');

            // 清理可能殘留的監聽器，防止漏網之魚
            clearAllMixerListeners();

            // 停止現有動作
             danceActionsMap.forEach(group => {
                group.forEach(action => action.fadeOut(0.5));
            });

            // 載入資源
            await loadDanceAssets(); 
            
            // 再次確認狀態
            isDancing = true;
            updateCameraPosition();
            
            // BGM 播放
            try {
                if (!bgm.paused) bgm.pause();
                bgm.currentTime = 0;
                bgm.muted = isMuted;
                const playPromise = bgm.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => { console.warn("BGM Auto-play failed:", error); });
                }
            } catch(e) { console.error("BGM Fatal Error:", e); }

            // 轉換傳入的舞步陣列
            let seq = Array.isArray(sequence) ? sequence : [];
            let is2D = seq.length > 0 && Array.isArray(seq[0]);
            
            currentDanceQueue = [];
            
            if (is2D) {
                // 如果仍是2D防呆未攔截乾淨，強制轉換成1D
                let maxSteps = Math.max(...seq.map(arr => Array.isArray(arr) ? arr.length : 0));
                for (let step = 0; step < maxSteps; step++) {
                    let charSeq = seq[0] || [];
                    let danceId = charSeq[step] !== undefined ? charSeq[step] : 99;
                    if (danceId === -1) danceId = Math.floor(Math.random() * DANCE_URLS.length);
                    currentDanceQueue.push(danceId); 
                }
            } else {
                // 1D 陣列
                currentDanceQueue = seq.map(id => {
                    if (id === -1) return Math.floor(Math.random() * DANCE_URLS.length); 
                    return id;
                });
            }

            let firstStep = currentDanceQueue.length > 0 ? currentDanceQueue[0] : null;
            let wFirst = firstStep; // 單角色直接對應

            // 淡出閒置與說話動作
            if (idleActionW && wFirst !== 99) idleActionW.fadeOut(0.5);
            if (talkingActionW) talkingActionW.fadeOut(0.5);
            
            console.log("AI 舞步序列解碼完成 (Queue):", currentDanceQueue);
            // ⭐ 將最終系統要執行的排程陣列印到監控面板
            logAction(`[系統] 開始執行舞蹈排程 Queue: ${JSON.stringify(currentDanceQueue)}`);
            playNextDanceInQueue();
        }

        // ⭐⭐⭐ AI 舞蹈引擎：全同步等待機制 ⭐⭐⭐
        function playNextDanceInQueue() {
            if (currentDanceQueue.length === 0) {
                // 序列結束，自然恢復閒置
                isDancing = false;
                bgm.pause();
                bgm.currentTime = 0;
                danceBtn.classList.remove('active');

                // 淡出所有進行中的「非閒置」動作
                currentVrms.forEach((v, i) => {
                    const fadeAction = currentActiveActions[i];
                    let idleA = idleActionW;
                    if (fadeAction && fadeAction !== idleA) {
                        fadeAction.fadeOut(0.5);
                    }
                });

                // 確保監聽器被清除
                clearAllMixerListeners();

                setTimeout(() => updateCameraPosition(), 500);
                
                // ⭐ 修復：確保跳舞結束回歸 Idle 時給予滿權重，防止卡在 T-pose
                if (idleActionW && currentActiveActions[0] !== idleActionW) { idleActionW.reset(); idleActionW.setEffectiveWeight(1); idleActionW.fadeIn(0.5).play(); }
                
                // 清空追蹤
                currentActiveActions = [null];
                
                // 當整個連續舞步全部跳完後，才執行之前因為跳舞而被擱置的麥克風重啟任務！
                if (window.pendingMicResume) {
                    window.pendingMicResume = false;
                    setTimeout(() => {
                        if (!isRecording) startRecording();
                    }, 500);
                }
                return;
            }

            let nextData = currentDanceQueue.shift(); 
            logAction(`[系統] 執行排程步驟: ${JSON.stringify(nextData)}`);
            
            // 安全性驗證與越界防呆
            let v = parseInt(nextData);
            if (v === 99) {
                nextData = 99; // ⭐ 支援 99 (站在原地不跳舞)
            } else if (isNaN(v) || v < 0 || v >= DANCE_URLS.length) {
                nextData = Math.floor(Math.random() * DANCE_URLS.length);
            } else {
                nextData = v;
            }
            
            currentPlayingDanceData = nextData; 

            let dancersFinished = [true]; // 單人版本預設
            let anyoneDancing = false;
            let stepTriggered = false; // ⭐ 加入單次鎖定

            currentVrms.forEach((vrm, vrmIndex) => {
                if (!vrm || !vrm.userData.mixer) return;
                
                let nextIndex = nextData;
                const oldAction = currentActiveActions[vrmIndex];

                // ⭐ 單獨跳舞邏輯：如果這個人的動作是 99，代表他這回合原地不動
                if (nextIndex === 99) {
                    dancersFinished[vrmIndex] = true; 
                    
                    let idleA = idleActionW;
                    
                    if (oldAction && oldAction !== idleA) {
                        oldAction.fadeOut(0.5);
                    }
                    
                    if (idleA && oldAction !== idleA) {
                        if (!idleA.isRunning() || idleA.getEffectiveWeight() === 0) {
                            idleA.reset();
                            idleA.setEffectiveWeight(1); // ⭐ 防止無動畫
                            idleA.fadeIn(0.5).play();
                        } else if (idleA.getEffectiveWeight() < 1) {
                            // 如果正在 fadeOut 中，補救回來
                            idleA.setEffectiveWeight(1);
                            idleA.fadeIn(0.5).play();
                        }
                        currentActiveActions[vrmIndex] = idleA;
                    } else if (!idleA) {
                        currentActiveActions[vrmIndex] = null;
                    }
                    return; 
                }
                
                const action = danceActionsMap[nextIndex]?.[vrmIndex];
                
                if (action) {
                    anyoneDancing = true;
                    dancersFinished[vrmIndex] = false; 
                    
                    if (oldAction && oldAction !== action) {
                        oldAction.fadeOut(0.5);
                    }

                    if (oldAction === action) {
                        action.stop(); 
                        action.reset();
                        action.setEffectiveWeight(1); 
                        action.play();
                    } else {
                        action.reset();
                        action.setLoop(THREE.LoopOnce);
                        action.clampWhenFinished = true; // ⭐ 完美停格
                        action.setEffectiveWeight(1);
                        action.fadeIn(0.5);
                        action.play();
                    }
                    
                    currentActiveActions[vrmIndex] = action; 

                    const onFinished = (e) => {
                        if (e.action === action) {
                            if (currentDanceListeners[vrmIndex]) {
                                vrm.userData.mixer.removeEventListener('finished', currentDanceListeners[vrmIndex]);
                                currentDanceListeners[vrmIndex] = null;
                            }

                            if (!isDancing) return;
                            if (currentActiveActions[vrmIndex] !== action) return; // 忽略舊動作

                            dancersFinished[vrmIndex] = true; // 此人跳完

                            if (dancersFinished.every(v => v) && !stepTriggered) {
                                stepTriggered = true; // 鎖定
                                playNextDanceInQueue(); // 觸發下一輪
                            }
                        }
                    };
                    assignMixerListener(vrm, vrmIndex, onFinished);
                } else {
                    currentActiveActions[vrmIndex] = null;
                }
            });

            // 如果完全沒人有動作，延遲後直接進行下一步
            if (!anyoneDancing && !stepTriggered) {
                stepTriggered = true;
                setTimeout(() => playNextDanceInQueue(), 50);
            }
        }

        danceBtn.addEventListener('touchend', (e) => {

        // --- 情緒控制 ---
        const VALID_EMOTIONS = ['neutral', 'happy', 'angry', 'sad', 'relaxed', 'surprised'];
        function setEmotion(emotionName) {
            if (currentVrms.length === 0) return;
            if (emotionName === 'joy') emotionName = 'happy';
            if (emotionName === 'sorrow') emotionName = 'sad';
            if (emotionName === 'fun') emotionName = 'relaxed';
            if (!VALID_EMOTIONS.includes(emotionName)) emotionName = 'neutral';
            
            updateDebugDisplay(emotionName, null);
            
            // 套用到所有角色
            currentVrms.forEach(vrm => {
                if(!vrm) return;
                VALID_EMOTIONS.forEach(emo => vrm.expressionManager.setValue(emo, 0));
                if (emotionName !== 'neutral') vrm.expressionManager.setValue(emotionName, 0.8);
            });
        }

        window.actionActive = false;
        function triggerAction(actionName, duration) {
            if (currentVrms.length === 0 || actionName === 'none') return;
            updateDebugDisplay(null, `${actionName}`);
            let shapeName = actionName === 'blink_left' ? 'blinkLeft' : (actionName === 'blink_right' ? 'blinkRight' : 'blink');
            window.actionActive = true;
            
            currentVrms.forEach(vrm => {
                if(vrm) vrm.expressionManager.setValue(shapeName, 1.0);
            });
            
            setTimeout(() => {
                currentVrms.forEach(vrm => {
                    if(vrm) vrm.expressionManager.setValue(shapeName, 0);
                });
                window.actionActive = false;
                updateDebugDisplay(null, 'Done');
            }, duration);
        }

            let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
            safeText = safeText.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

            chatDisplay.appendChild(div);
            chatDisplay.scrollTo({ top: chatDisplay.scrollHeight, behavior: 'smooth' });

        // 解鎖語音函式 (Android 必須)
        async function unlockTTS() {

            return new Promise(resolve => {
                try {

                    // ⭐⭐⭐ 修復：防止 GC 回收 ⭐⭐⭐

        // ⭐⭐⭐ 4️⃣ 接收 AI 回應（修正誤判跳舞的最終版） ⭐⭐⭐
        function handleAIResponse(aiText) {
            let result = safeParseAIJson(aiText);
            
            // ⭐ 將 AI 原始文字與解析結果印到監控面板，方便錄影抓蟲
            logAction(`Raw AI Text:\n${aiText}`);
            
            let danceSeq = null;

            if (result) {
                logAction(`Parsed Result:\nAction: ${result.action}\nDance List: ${JSON.stringify(result.dance_list)}`);
                if (result.action === 'dance_sequence' || result.action === 'dance_random') {
                    if (Array.isArray(result.dance_list) && result.dance_list.length > 0) {
                        danceSeq = result.dance_list;
                    } else if (result.action === 'dance_random') {
                        danceSeq = [Math.floor(Math.random() * DANCE_URLS.length)];
                    } else {
                        danceSeq = guessDanceFromText(result.text);
                        if (!danceSeq) danceSeq = [Math.floor(Math.random() * DANCE_URLS.length)];
                    }
                }
            } else {
                logAction(`Parse Failed! 使用關鍵字兜底猜測`);
                danceSeq = guessDanceFromText(aiText);
            }

            // 如果判定要跳舞，執行跳舞
            if (danceSeq) {
                let contextText = aiText;
                if (chatHistory.length >= 2 && chatHistory[chatHistory.length - 2].role === "user") {
                    contextText += " " + chatHistory[chatHistory.length - 2].parts[0].text;
                }
                danceSeq = fixDanceSequence(danceSeq, contextText);
                playDanceSequence(danceSeq);
            } 
            
            // ⭐⭐⭐ 防呆說話提取：絕對不讓使用者聽到/看到原始的 JSON 程式碼 ⭐⭐⭐
            let speakText = aiText;
            if (result && result.text) {
                speakText = result.text;
            } else {
                try {
                    const textMatch = aiText.match(/"text"\s*:\s*"((?:\\"|[^"])*)"/);
                    if (textMatch) {
                        speakText = textMatch[1].replace(/\\n/g, '\n').replace(/\\"/g, '"');
                    } else {
                        speakText = aiText.replace(/```json/gi, '').replace(/```/g, ''); 
                    }
                } catch (e) {
                    speakText = "我好像跳針了，但舞步已經安排好囉！";
                }
            }
            speak(speakText || "");
            
            if (result && result.corrected_text) {
                const userMsgs = document.querySelectorAll('.message-user');
                if (userMsgs.length > 0) {
                    userMsgs[userMsgs.length - 1].innerHTML = result.corrected_text;
                }
            }

            if (result && result.emotion) {
                setEmotion(result.emotion);
            }
            
            if (result && result.action && result.action !== 'none' && !result.action.startsWith('dance')) {
                triggerAction(result.action, 2000);
            }
        }

        async function handleSendMessage() {
            // 防止重複點擊
            if (userInput.disabled || sendBtn.disabled) return;

            const text = userInput.value.trim();
            if (!text) return;
            
            // ⭐⭐⭐ 發送訊息時，如果正在錄音，暫時停止，以免系統把自己的話錄進去 ⭐⭐⭐
            if (isRecording) {
                stopRecording(); 
                window.shouldResumeMic = true; // 標記需要自動重啟
            } else {
                window.shouldResumeMic = false;
            }

            // ⭐ 若正在跳舞，先停止跳舞
            if (isDancing) stopDance();

            // ⭐⭐⭐ 新增：發送訊息前，確保徹底停止上一次的語音 ⭐⭐⭐
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }

            // ⭐⭐⭐ 每次發送訊息前都重新解鎖語音（Android 必須）
            if (!isMuted && ttsSupported) {
                logTTS("開始訊息發送流程...");
                await Promise.race([
                    unlockTTS(),
                    new Promise(r => setTimeout(r, 300))
                ]);
            }

            userInput.value = ''; userInput.disabled = true; sendBtn.disabled = true;
            addMessage(text, 'user');
            
            if (isPreviewEnv) {
                addMessage("【提示】預覽模式無法連接 AI，請部署至 Vercel。", 'system');
                userInput.disabled = false; sendBtn.disabled = false; userInput.focus();
                return;
            }

            const loadingMsg = addMessage("Thinking...", 'system');
            
            chatHistory.push({ role: "user", parts: [{ text: text }] });

            let finalSystemInstruction = "";
            
            if (externalSystemPrompt) finalSystemInstruction += externalSystemPrompt;
            else finalSystemInstruction += `You are a virtual AI character. Reply in Traditional Chinese. Output JSON: { "text": "response", "emotion": "neutral", "action": "none" }`;

            if (externalKnowledge) {
                finalSystemInstruction += "\n\n====== KNOWLEDGE BASE ======\n" + externalKnowledge + "\n============================\n";
            }

            // ⭐ 強化 AI 回傳多回合的指令說明 (調整為單人版本)
            finalSystemInstruction += `
【CRITICAL INSTRUCTIONS】
1. **JSON FORMAT ONLY**: You MUST output a strictly valid JSON object. Do not wrap it in markdown block like \`\`\`json.
2. **PERSONA**: Keep responses natural, conversational, and concise. Do NOT refer to yourself as code or mention JSON format to the user.
3. **DANCE SYSTEM**:
   - Dance IDs available: 0(霹靂舞A), 1(湯瑪斯), 2(嘻哈), 3(霹靂舞B), 99(不跳舞/原地待命).
   - "action" must be "dance_sequence".
   - **多回合排程 (CRITICAL)**：當使用者要求「跳多次」或「連續跳不同舞」時，你必須在 "dance_list" 中產生對應數量的步驟。
   - **連續跳舞 (1D Array)**: 若使用者要求「連續跳兩次」，請回傳 [1, 1]。若單次請回傳 [2]。
4. **SPEECH CORRECTION**: Correct any typos in the user's raw speech text and return it in "corrected_text".
`;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s timeout

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: chatHistory,
                        systemInstruction: { parts: [{ text: finalSystemInstruction }] }
                    }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    let errMsg = "Server Error";
                    try {
                         const errData = await response.json();
                         if (errData.error) errMsg = errData.error;
                    } catch(e) {}
                    throw new Error(errMsg);
                }

                const data = await response.json();
                removeMessage(loadingMsg);
                
                let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error";
                
                chatHistory.push({ role: "model", parts: [{ text: rawText }] });
                
                handleAIResponse(rawText);
                
                let tempResult = safeParseAIJson(rawText);
                let displayText = rawText;
                if (tempResult && tempResult.text) {
                    displayText = tempResult.text;
                } else {
                    try {
                        const textMatch = rawText.match(/"text"\s*:\s*"((?:\\"|[^"])*)"/);
                        if (textMatch) {
                            displayText = textMatch[1].replace(/\\n/g, '<br>').replace(/\\"/g, '"');
                        } else {
                            displayText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                        }
                    } catch(e) {
                        displayText = "好喔！我們這就為您跳舞！";
                    }
                }
                addMessage(displayText, 'ai');

            } catch (error) {
                console.error(error);
                removeMessage(loadingMsg);
                if (error.name === 'AbortError') {
                    addMessage(`錯誤: 連線逾時 (Timeout)，請重試。`, 'system');
                } else {
                    addMessage(`錯誤: ${error.message}`, 'system');
                }
            } finally {
                userInput.disabled = false; sendBtn.disabled = false; userInput.focus();
            }
        }

        async function speak(text) {
            if (isMuted) return;
            if (!ttsSupported || !window.speechSynthesis) {
                logTTS("❌ 說話失敗: 語音功能不支援");
                return;
            }

            // 移除網址與符號，避免 Android TTS 當掉
            const cleanText = text
                .replace(/\[.*?\]\(.*?\)/g, '')
                .replace(/[^\u4e00-\u9fa5a-zA-Z0-9,.\?！。，、…~]/g, '');

            if (!cleanText || cleanText.length === 0) {
                // 如果沒話說，但原本需要重啟麥克風，則延遲重啟
                if (window.shouldResumeMic) {
                     setTimeout(() => { if(!isRecording) startRecording(); }, 500);
                }
                return;
            }

            logTTS(`準備說話: ${cleanText.substring(0, 10)}...`);

            try {
                if (speechSynthesis.getVoices().length === 0) {
                    logTTS("等待語音列表...");
                    await new Promise(r => setTimeout(r, 300));
                }

                speechSynthesis.cancel();
                await new Promise(r => setTimeout(r, 50));

                const u = new SpeechSynthesisUtterance(cleanText);
                window.currentUtterance = u; 

                // ===== Android 專用強化 =====
                if (isAndroid) {
                    const voices = speechSynthesis.getVoices();
                    const voice =
                        voices.find(v => v.lang === 'zh-TW') ||
                        voices.find(v => v.lang.includes('zh-TW')) ||
                        voices.find(v => v.lang.includes('zh-HK')) ||
                        voices.find(v => v.lang.includes('zh-CN')) ||
                        voices.find(v => v.lang.includes('zh'));

                    if (voice) {
                        u.voice = voice;
                        u.lang  = voice.lang;
                        logTTS(`Android 使用語音: ${voice.name}`);
                    } else {
                        u.lang = 'zh-TW';
                        logTTS("Android 使用預設 zh-TW");
                    }
                } else {
                    u.lang = 'zh-TW';
                }

                u.volume = 1;

                u.onstart = () => {
                    isSpeaking = true;
                    logTTS("開始播放 (onstart)");
                    if (!isDancing) {
                        // 淡出閒置
                        if (idleActionW) idleActionW.fadeOut(0.2); 
                        
                        // ⭐ 修復：加入 setEffectiveWeight 確保講話時不會掉回無動畫狀態
                        if (talkingActionW) {
                            talkingActionW.reset();
                            talkingActionW.setEffectiveWeight(1);
                            talkingActionW.fadeIn(0.2).play();
                        }
                    }
                };
                
                u.onend   = () => {
                    isSpeaking = false;
                    logTTS("播放結束 (onend)");
                    // 結束時讓所有角色閉嘴
                    currentVrms.forEach(vrm => {
                        if(vrm) {
                            vrm.expressionManager.setValue('aa', 0);
                            if (isOpeningRemark) {
                                vrm.expressionManager.setValue('happy', 0);
                            }
                        }
                    });
                    
                    isOpeningRemark = false; // ⭐ 重置開場白標記
                    
                    const wasTalkingW = talkingActionW && talkingActionW.isRunning() && talkingActionW.getEffectiveWeight() > 0;

                    if (talkingActionW) talkingActionW.fadeOut(0.5); 
                    
                    if (!isDancing) {
                        const safeRestoreIdle = (idleA) => {
                            if (idleA) {
                                if (!idleA.isRunning() || idleA.getEffectiveWeight() === 0) {
                                    idleA.reset();
                                    idleA.setEffectiveWeight(1);
                                    idleA.fadeIn(0.5).play();
                                } else {
                                    idleA.setEffectiveWeight(1);
                                }
                            }
                        };
                        safeRestoreIdle(idleActionW);
                    }

                    // ⭐⭐⭐ Auto Resume Mic logic ⭐⭐⭐
                    if (window.shouldResumeMic) {
                        if (isDancing) {
                            window.pendingMicResume = true;
                        } else {
                            setTimeout(() => {
                                if (!isRecording) startRecording();
                            }, 500);
                        }
                    }
                };

                u.onerror = (e) => {
                    if (e.error === 'interrupted' || e.error === 'canceled') {
                        return; // 這是正常的，不顯示錯誤
                    }
                    console.error("TTS error detail:", e.error);
                    logTTS(`TTS 錯誤: ${e.error}`);
                };

                speechSynthesis.speak(u);

            } catch (err) {
                console.error("Speech error:", err);
                logTTS(`Speech 執行錯誤: ${err.message}`);
            }
        }

        sendBtn.addEventListener('click', handleSendMessage);
        // 新增 touchend 支援，解決部分手機點擊無反應問題
        sendBtn.addEventListener('touchend', (e) => {
            e.preventDefault(); 
            handleSendMessage();

            camera.aspect = window.innerWidth / window.innerHeight;

        // ⭐⭐⭐⭐⭐ 麥克風與語音辨識功能整合 (完全保留穩定版邏輯) ⭐⭐⭐⭐⭐
        let recognition = null;
        let isRecording = false;
        let silenceTimer = null;
        let finalTranscript = '';
        const voiceOverlay = document.getElementById('voice-overlay'); // 藍色波動條

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            
            if (isIOS || isAndroid) {
                recognition.continuous = false; 
                recognition.maxAlternatives = 1; 
            } else {
                recognition.continuous = true; 
            }
            
            recognition.interimResults = true; 
            recognition.lang = 'zh-TW'; 

            recognition.onstart = () => { 
                isRecording = true; 
                updateMicUI(true);

                isSpeaking = false;

            recognition.onend = () => {

                    if (isIOS || isAndroid) {

                           if (isRecording) safeStartRecognition(); 
                       }, 250);
                    }
                } else {
                    updateMicUI(false); 
                }
            };
            
            recognition.onerror = (e) => { 
                if (e.error === 'no-speech' || e.error === 'aborted') {
                    return;
                }

                console.error("Speech Recognition Error:", e.error);
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    isRecording = false;
                    updateMicUI(false);
                    alert("麥克風功能已被封鎖或不支援。\n請檢查瀏覽器權限設定，或嘗試在 Safari (iOS) / Chrome (Android) 中開啟。");
                } else {
                    recognition.stop();
                }
            };

            recognition.onresult = (e) => {
                let interim = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        finalTranscript += e.results[i][0].transcript;
                    } else {
                        interim += e.results[i][0].transcript;
                    }
                }
                
                userInput.value = finalTranscript + interim;
                
                clearTimeout(silenceTimer);
                
                if (userInput.value.trim()) {
                    silenceTimer = setTimeout(async () => { 
                        const rawText = userInput.value.trim();
                        if(rawText) {
                            handleSendMessage();
                        }
                    }, 1500);
                }
            };
        } else {
            console.warn("瀏覽器不支援 Web Speech API");
            micBtn.style.display = 'none';
        }

        function toggleRecording() {
            if(!recognition) return;
            if(isRecording) stopRecording(); else startRecording();
        }

        function startRecording() {
            if (isDancing) {
                stopDance();
            }

            if (window.speechSynthesis) {
                try {
                    window.speechSynthesis.cancel();
                } catch(e) {}
            }
            isSpeaking = false;

            finalTranscript = ''; 
            userInput.value = ''; 
            isRecording = true; 
            
            safeStartRecognition();
        }

        function stopRecording() { 
            isRecording = false; 
            recognition.stop(); 
            clearTimeout(silenceTimer); 
            updateMicUI(false); 
        }

        function safeStartRecognition() { 
            try { 
                recognition.start(); 
            } catch(e) {
            } 
        }

        function updateMicUI(active) {
            if(active) { 
                micBtn.classList.add('recording-pulse'); 
                micBtn.innerHTML = '<i class="fa-solid fa-microphone-lines"></i>'; 
                voiceOverlay.style.display = 'block'; 
            } else { 
                micBtn.classList.remove('recording-pulse'); 
                micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
                voiceOverlay.style.display = 'none'; 
            }
        }

        micBtn.addEventListener('click', (e) => {
            logTTS(`麥克風按鈕觸發: ${e.type}`); 
            
            if (isIOS && (isLineApp || isFbApp)) {
                alert("⚠️ LINE/Facebook 內建瀏覽器不支援麥克風錄音。\n\n請點擊右上角/右下角選單，選擇「在 Safari 開啟」或「開啟預設瀏覽器」即可使用完整功能。");
                return;
            }
            
            toggleRecording();
        });

    </script>
</body>
</html>
