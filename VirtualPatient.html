</head>
<body class="bg-gray-50 text-gray-800 font-sans h-[100dvh] flex flex-col overflow-hidden">

  <!-- 系統核心變數與 API 設定 -->
  <script>
    const apiKey = "AIzaSyAtdY1VIf__RKKssL_o7xaBbG3McxcrMvU"; // API Key will be provided by the environment

    const allVoices = [

  <!-- 頂部導覽列 (新增雙頁籤) -->
  <header class="flex flex-col md:flex-row items-center justify-between px-4 md:px-6 pt-3 bg-gray-900 text-white shadow-md z-20 shrink-0">
    <div class="flex items-center space-x-3 mb-2 md:mb-0 pb-2 md:pb-3 w-full md:w-auto border-b md:border-b-0 border-gray-700">
      <div class="bg-blue-600 p-1.5 rounded-lg shrink-0">
        <i data-lucide="activity" class="w-5 h-5 text-white"></i>
      </div>
      <h1 class="text-base md:text-lg font-semibold tracking-wide truncate">
        醫學生看診測驗系統
      </h1>
    </div>
    
    <!-- 頁籤切換 -->
    <div class="flex space-x-6 px-2 w-full md:w-auto justify-start md:justify-end">
      <button onclick="switchView('simulation')" id="tabSimulation" class="pb-3 tab-active transition-colors flex items-center">
        <i data-lucide="stethoscope" class="w-4 h-4 mr-2"></i> 模擬看診
      </button>
      <button onclick="switchView('editor')" id="tabEditor" class="pb-3 tab-inactive transition-colors flex items-center">
        <i data-lucide="users" class="w-4 h-4 mr-2"></i> 虛擬病人編輯
      </button>
    </div>
  </header>

  <!-- ==================== 視圖 1: 模擬看診區 ==================== -->
  <main id="viewSimulation" class="flex-1 flex flex-col md:flex-row overflow-hidden p-3 md:p-6 gap-4 bg-gray-50">
    
    <!-- 左欄：頭像與病患資訊 -->
    <div class="w-full md:w-4/12 lg:w-3/12 flex flex-col gap-4 overflow-y-auto h-[38%] md:h-full shrink-0 md:shrink pr-1 pb-2 md:pb-0">
      
      <!-- 選擇病患選單 -->
      <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-200 shrink-0">
        <label class="text-xs text-gray-500 block mb-1">選擇看診病患</label>
        <select id="simPatientSelect" onchange="handleSimPatientChange(event)" class="w-full bg-blue-50 border border-blue-200 text-blue-900 font-medium text-sm rounded-lg p-2 focus:ring-blue-500 outline-none">
          <!-- 透過 JS 動態產生 -->
        </select>
      </div>

      <!-- 頭像與狀態卡片 -->
      <div class="flex flex-col bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden shrink-0 relative">
        <div class="absolute top-3 left-3 z-10 flex items-center space-x-2 bg-black/50 backdrop-blur-sm text-white px-2.5 py-1 rounded-full text-xs font-medium">
          <span id="statusDot" class="w-2 h-2 rounded-full bg-gray-400"></span>
          <span id="statusText">等待問診</span>
        </div>

        <div id="avatarContainer" class="h-[140px] md:h-[22vh] relative bg-gray-100 flex items-center justify-center overflow-hidden transition-all duration-300">
          <img id="simAvatar" src="" alt="虛擬病患" class="object-cover w-full h-full transition-transform duration-[2s] scale-100" />
          <!-- 修正：將 object-cover 改為 object-contain，防止影片人物頭部被裁切 -->

          <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent pointer-events-none"></div>

            <div class="w-1.5 bg-white/80 rounded-full animate-pulse" style="height: 25px; animation-delay: 0.2s"></div>
            <div class="w-1.5 bg-white/80 rounded-full animate-pulse" style="height: 18px; animation-delay: 0.3s"></div>
            <div class="w-1.5 bg-white/80 rounded-full animate-pulse" style="height: 28px; animation-delay: 0.4s"></div>

          </div>

      <!-- 病患資訊卡片 -->

  <!-- 應用程式邏輯 JavaScript -->
  <script>
    lucide.createIcons();

    // --- 音訊處理工具 ---
    function createWavFile(pcmData, sampleRate = 24000) {
      const numChannels = 1;
      const bitsPerSample = 16;
      const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
      const blockAlign = (numChannels * bitsPerSample) / 8;
      const dataSize = pcmData.byteLength || pcmData.length;
      const chunkSize = 36 + dataSize;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeString = (view, offset, string) => {
        for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
      };

      writeString(view, 0, 'RIFF'); view.setUint32(4, chunkSize, true);
      writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true); view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true); writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      const pcmBytes = new Uint8Array(pcmData);
      const pcmView = new Uint8Array(buffer, 44);
      pcmView.set(pcmBytes);

      return new Blob([view], { type: 'audio/wav' });
    }

    async function fetchWithRetry(url, options, maxRetries = 5) {
      let retries = 0; const baseDelay = 1000;
      while (retries < maxRetries) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          return await response.json();
        } catch (error) {
          retries++;
          if (retries === maxRetries) throw error;
          await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, retries - 1)));
        }
      }
    }

    function loadSimPatient(id) {
      if(!id) return;
      state.currentSimPatientId = id;
      const p = state.patients.find(pt => pt.id === id);
      if(!p) return;

      // 更新左側卡片
      dom.simAvatar.src = p.imageUrl;
      
      // 處理影片或圖片顯示
      if (p.videoMode === 'heygen') {
        // HeyGen 模式：連線前先顯示靜態圖片

        dom.simAvatarVideo.classList.add('hidden');
        dom.simAvatarVideo.src = '';
        dom.simAvatarVideo.srcObject = null;
        dom.simAvatarVideo.muted = false; // HeyGen 串流自帶聲音，取消靜音
        dom.simAvatarVideo.loop = false;
      } else if (p.videoUrl) {
        // MP4 模式
        dom.simAvatar.classList.add('hidden');
        dom.simAvatarVideo.classList.remove('hidden');
        dom.simAvatarVideo.srcObject = null;
        dom.simAvatarVideo.src = p.videoUrl;

        dom.simAvatarVideo.loop = true;

        dom.simAvatar.classList.remove('hidden');
        dom.simAvatarVideo.classList.add('hidden');

    function renderMessages(messages) {
      dom.chatHistory.innerHTML = messages.map(msg => {
        if (msg.role === 'system') {
          return `<div class="flex justify-center my-2"><span class="bg-gray-200 text-gray-600 text-xs py-1 px-3 rounded-full">${msg.text}</span></div>`;
        }
        const isUser = msg.role === 'user';
        const p = state.patients.find(pt => pt.id === state.currentSimPatientId);
        return `
          <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[85%] md:max-w-[80%] rounded-2xl px-4 py-2.5 shadow-sm ${isUser ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-gray-800 border border-gray-200 rounded-bl-none'}">
              ${!isUser ? `<div class="text-xs font-semibold text-gray-400 mb-1">${p.name}</div>` : ''}
              <p class="leading-relaxed text-sm md:text-base whitespace-pre-wrap">${msg.text}</p>
            </div>
          </div>`;
      }).join('');
      dom.chatHistory.scrollTop = dom.chatHistory.scrollHeight;
    }

    async function handleSend() {
      const text = dom.inputText.value.trim();
      const p = state.patients.find(pt => pt.id === state.currentSimPatientId);
      if (!text || state.isProcessing || state.isSpeaking || !p) return;

      dom.inputText.value = '';
      p.messages.push({ role: 'user', text: text });
      renderMessages(p.messages);
      setProcessingState(true);

      try {
        // 大腦生成
        const systemPrompt = `你現在是一位${p.age}歲的${p.gender}性病患，名叫「${p.name}」。
你現在人在醫療機構看診。
情境設定：${p.scenario}
請完全沉浸在角色中，用語氣自然的${p.language || '中文'}口語回答（每次回答不超過30個字）。
有時候可以表現出符合你情境設定的狀態（例如失智症可能會稍微停頓或忘記：「呃...我不太記得了」）。
使用者是正在對你進行問診的醫學生。`;

        const historyParts = p.messages.filter(m => m.role !== 'system').map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] }));
        const textPayload = { contents: [...historyParts, { role: "user", parts: [{ text: text }] }], systemInstruction: { parts: [{ text: systemPrompt }] } };

        // 修正：更換為公開穩定版的 gemini-2.5-flash 模型
        const textResult = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(textPayload)
        });
        const aiText = textResult.candidates?.[0]?.content?.parts?.[0]?.text || "（沉默）";
        
        p.messages.push({ role: 'avatar', text: aiText });
        renderMessages(p.messages);

        // 依據顯示模式處理語音與影像
        if (p.videoMode === 'heygen') {
          // 模式 B: HeyGen 即時串流 API
          if (!heygenSessionId) {
            dom.loadingText.textContent = "連接 HeyGen 伺服器中...";
            const newRes = await fetch('https://api.heygen.com/v1/streaming.new', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${p.heygenToken}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ quality: "high", avatar_name: p.heygenAvatarId, version: "v2" })
            }).then(r => r.json());

            if (!newRes.data || !newRes.data.session_id) throw new Error("HeyGen 連線失敗，請檢查 Token 與 Avatar ID。");

            heygenSessionId = newRes.data.session_id;
            
            peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            peerConnection.ontrack = (event) => {
              dom.simAvatar.classList.add('hidden');
              dom.simAvatarVideo.classList.remove('hidden');
              dom.simAvatarVideo.srcObject = event.streams[0];
              dom.simAvatarVideo.play().catch(e => console.log(e));
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: newRes.data.sdp.sdp }));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await fetch('https://api.heygen.com/v1/streaming.start', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${p.heygenToken}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ session_id: heygenSessionId, sdp: { type: 'answer', sdp: answer.sdp } })
            });
          }

          dom.loadingText.textContent = "傳送語音任務中...";
          await fetch('https://api.heygen.com/v1/streaming.task', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${p.heygenToken}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: heygenSessionId, text: aiText, task_type: 'talk' })
          });

          // 模擬說話狀態長度 (依據字數估算)
          setSpeakingState(true);
          setTimeout(() => { if(state.currentSimPatientId === p.id) setSpeakingState(false); }, aiText.length * 280);

        } else {
          // 模式 A: 修正為參考 index.html 的瀏覽器內建 Web Speech API，不需消耗語音 API Key
          const langMap = {'中文': 'zh-TW', '英文': 'en-US', '法文': 'fr-FR', '德文': 'de-DE', '西班牙文': 'es-ES', '日文': 'ja-JP', '韓文': 'ko-KR', '越南文': 'vi-VN', '印尼文': 'id-ID', '泰文': 'th-TH'};
          
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(aiText);
          utterance.rate = p.speechSpeed;
          utterance.lang = langMap[p.language] || 'zh-TW';
          
          utterance.onstart = () => { setSpeakingState(true); };
          utterance.onend = () => { if(state.currentSimPatientId === p.id) setSpeakingState(false); };
          utterance.onerror = () => { if(state.currentSimPatientId === p.id) setSpeakingState(false); };

          window.speechSynthesis.speak(utterance);
        }
      } catch (error) {
        console.error("錯誤:", error);
        p.messages.push({ role: 'system', text: '系統錯誤：連線或生成失敗。' });
        renderMessages(p.messages);
      } finally {
        setProcessingState(false);
      }
    }

    function setProcessingState(isProc) {
      state.isProcessing = isProc;
      updateSendButtonState();
      const pName = state.patients.find(pt => pt.id === state.currentSimPatientId)?.name || '';
      
      if (isProc) {
        dom.loadingIndicator.classList.remove('hidden');
        dom.statusDot.className = "w-2 h-2 rounded-full bg-yellow-400 animate-pulse";
        dom.statusText.textContent = "思考中...";
        dom.loadingText.textContent = `${pName}思考中...`;
      } else {
        dom.loadingIndicator.classList.add('hidden');
        if (!state.isSpeaking) {
          dom.statusDot.className = "w-2 h-2 rounded-full bg-gray-400";
          dom.statusText.textContent = "等待問診";
        }
      }
      dom.chatHistory.scrollTop = dom.chatHistory.scrollHeight;
    }

    function setSpeakingState(isSpeak) {
      state.isSpeaking = isSpeak;
      updateSendButtonState();
      const p = state.patients.find(pt => pt.id === state.currentSimPatientId);

      if (isSpeak) {
        dom.statusDot.className = "w-2 h-2 rounded-full bg-green-400 animate-pulse";
        dom.statusText.textContent = "說話中...";
        dom.avatarContainer.classList.add('ring-4', 'ring-blue-400/30', 'ring-inset');
        dom.simAvatar.classList.add('scale-105');
        dom.speakingAnim.classList.remove('hidden');
        if (p && p.videoMode === 'mp4' && p.videoUrl) {
          dom.simAvatarVideo.currentTime = 0; 
          dom.simAvatarVideo.playbackRate = p.speechSpeed;
          dom.simAvatarVideo.play().catch(e => console.log("Video play error:", e));
        }
      } else {
        if (!state.isProcessing) {
          dom.statusDot.className = "w-2 h-2 rounded-full bg-gray-400";
          dom.statusText.textContent = "等待問診";
        }
        dom.avatarContainer.classList.remove('ring-4', 'ring-blue-400/30', 'ring-inset');
        dom.simAvatar.classList.remove('scale-105');
        dom.speakingAnim.classList.add('hidden');
        if (p && p.videoMode === 'mp4') {
          dom.simAvatarVideo.pause();
        }
      }
    }

    function updateSendButtonState() {
      const text = dom.inputText.value.trim();
      const isDisabled = !text || state.isProcessing || state.isSpeaking || state.patients.length === 0;
      dom.inputText.disabled = state.isProcessing || state.isSpeaking || state.patients.length === 0;
      dom.sendBtn.disabled = isDisabled;
      dom.sendBtn.className = isDisabled 
        ? "p-2.5 md:p-3 rounded-xl flex items-center justify-center transition-all shrink-0 bg-gray-200 text-gray-400 cursor-not-allowed"
        : "p-2.5 md:p-3 rounded-xl flex items-center justify-center transition-all shrink-0 bg-blue-600 text-white hover:bg-blue-700 shadow-md hover:shadow-lg";
    }


    // ==================== 虛擬病人編輯區邏輯 ====================
    function refreshEditorPatientList() {
      dom.patientList.innerHTML = state.patients.map(p => `
        <button onclick="loadEditPatient('${p.id}')" class="w-full text-left px-3 py-2.5 rounded-lg mb-1 transition-colors ${p.id === state.currentEditPatientId ? 'bg-blue-50 border border-blue-200' : 'hover:bg-gray-50 border border-transparent'}">
          <div class="font-medium text-sm text-gray-800">${p.name}</div>
          <div class="text-xs text-gray-500">${p.gender} / ${p.age}歲</div>
        </button>
      `).join('');
    }

    function startCreatePatient() {
      state.currentEditPatientId = null;
      refreshEditorPatientList();
      dom.editFormTitle.innerHTML = `<i data-lucide="plus-circle" class="w-4 h-4 mr-2 text-blue-500"></i> 新增病患`;
      dom.btnDeletePatient.classList.add('hidden'); // 新增模式時隱藏刪除按鈕
      lucide.createIcons();
      
      dom.editName.value = '新病患';
      dom.editGender.value = '女';
      dom.editAge.value = 65;
      dom.editLanguage.value = '中文';

      dom.editSpeed.value = 1.0;
      dom.editSpeedLabel.textContent = '1.0x';

      dom.editHeygenToken.value = '';
      dom.editHeygenAvatarId.value = '';

      state.currentEditPatientId = id;
      refreshEditorPatientList();

      if(!p) return;

      dom.editFormTitle.innerHTML = `<i data-lucide="settings-2" class="w-4 h-4 mr-2 text-gray-500"></i> 編輯病患：${p.name}`;
      dom.btnDeletePatient.classList.remove('hidden'); // 編輯現有病患時顯示刪除按鈕
      lucide.createIcons();

      dom.editName.value = p.name;
      dom.editGender.value = p.gender;
      dom.editAge.value = p.age;
      dom.editLanguage.value = p.language || '中文';

      dom.editSpeed.value = p.speechSpeed;
      dom.editSpeedLabel.textContent = parseFloat(p.speechSpeed).toFixed(1) + 'x';

    function toggleVideoModeFields() {
      if (dom.editVideoMode.value === 'heygen') {
        dom.mp4Fields.classList.add('hidden');
        dom.heygenFields.classList.remove('hidden');
      } else {
        dom.mp4Fields.classList.remove('hidden');
        dom.heygenFields.classList.add('hidden');
      }
    }

    function savePatient() {
      const name = dom.editName.value.trim() || '未命名';
      const gender = dom.editGender.value;
      const age = parseInt(dom.editAge.value) || 60;
      const language = dom.editLanguage.value;
      const voiceName = dom.editVoice.value;
      const speechSpeed = parseFloat(dom.editSpeed.value);
      const videoMode = dom.editVideoMode.value;
      const videoUrl = dom.editVideoUrl.value.trim();
      const heygenToken = dom.editHeygenToken.value.trim();
      const heygenAvatarId = dom.editHeygenAvatarId.value.trim();
      const scenario = dom.editScenario.value.trim();
      
      // 給予通用頭像
      const imageUrl = gender === '女' 
        ? 'https://images.unsplash.com/photo-1551836022-4c4c79ec22ea?w=400&q=80'
        : 'https://images.unsplash.com/photo-1566492031523-05b0d014457e?w=400&q=80';

      if (state.currentEditPatientId) {
        // 更新現有
        const p = state.patients.find(pt => pt.id === state.currentEditPatientId);
        p.name = name; p.gender = gender; p.age = age; p.language = language;
        p.voiceName = voiceName; p.speechSpeed = speechSpeed;
        p.videoMode = videoMode; p.videoUrl = videoUrl;
        p.heygenToken = heygenToken; p.heygenAvatarId = heygenAvatarId;
        p.scenario = scenario; p.imageUrl = imageUrl;
        alert('病患資料已更新！');
        // 若當前模擬區正在看此病患，同步更新畫面
        if (state.currentSimPatientId === state.currentEditPatientId) {
          loadSimPatient(state.currentSimPatientId);
        }
      } else {
        // 新增
        const newId = 'p' + Date.now();
        state.patients.push({
          id: newId, name, gender, age, language, voiceName, speechSpeed, 
          videoMode, videoUrl, heygenToken, heygenAvatarId, 
          scenario, imageUrl,
          messages: [{ role: 'system', text: `系統提示：測驗已開始。目前病患為${name}。請藉由 MMSE 等工具進行問診。` }]
        });
        state.currentEditPatientId = newId;
        if(!state.currentSimPatientId) state.currentSimPatientId = newId;
        alert('新病患建立成功！');
      }
      refreshEditorPatientList();
    }

    // --- 刪除病患邏輯 ---
    function deletePatient() {
      if (!state.currentEditPatientId) return;
      dom.deleteModal.classList.remove('hidden'); // 顯示確認對話框
    }

    function closeDeleteModal() {
      dom.deleteModal.classList.add('hidden');
    }

    function confirmDeletePatient() {
      const pId = state.currentEditPatientId;
      
      // 從陣列中移除
      state.patients = state.patients.filter(pt => pt.id !== pId);
      
      // 如果刪除的是模擬區目前正在看診的病患，則重置模擬區
      if (state.currentSimPatientId === pId) {
        if (state.patients.length > 0) {
          state.currentSimPatientId = state.patients[0].id;
          loadSimPatient(state.currentSimPatientId);
        } else {
          // 若全部病人都被刪除了
          state.currentSimPatientId = null;
          dom.simAvatar.src = '';
          dom.simName.textContent = '--';
          dom.chatHistory.innerHTML = '';
          updateSendButtonState();
        }
      }

      // 更新兩邊的列表 UI
      refreshSimulationPatientList();
      refreshEditorPatientList();
      
      // 編輯區自動切換到下一個病患，或進入新增模式
      if (state.patients.length > 0) {
        loadEditPatient(state.patients[0].id);
      } else {
        startCreatePatient();
      }
      
      closeDeleteModal(); // 關閉視窗
    }

    // 聲音測試鈕 (修正為瀏覽器原生語音 API)
    async function testVoice() {
      const btn = dom.btnTestVoice;
      const originalHtml = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 mr-1 animate-spin"></i> 測試中...`;
      lucide.createIcons();
      btn.disabled = true;

      try {
        const name = dom.editName.value.trim() || '未命名';
        const speed = parseFloat(dom.editSpeed.value);
        const language = dom.editLanguage.value;
        
        const testGreetings = {
          '中文': `你好，醫生。我是${name}，這是我說話的聲音。`,
          '英文': `Hello doctor. I am ${name}, and this is my voice.`,
          '法文': `Bonjour docteur. Je suis ${name}, et voici ma voix.`,
          '德文': `Hallo Arzt. Ich bin ${name}, und das ist meine Stimme.`,
          '西班牙文': `Hola doctor. Soy ${name}, y esta es mi voz.`,
          '日文': `こんにちは、先生。私は${name}です。これが私の声です。`,
          '韓文': `안녕하세요 의사 선생님. 저는 ${name}입니다. 이것은 제 목소리입니다.`,
          '越南文': `Chào bác sĩ. Tôi là ${name}, và đây là giọng nói của tôi.`,
          '印尼文': `Halo dokter. Saya ${name}, dan ini adalah suara saya.`,
          '泰文': `สวัสดีครับ/ค่ะ หมอ ฉันชื่อ ${name} และนี่คือเสียงของฉัน`
        };
        const text = testGreetings[language] || testGreetings['中文'];
        const langMap = {'中文': 'zh-TW', '英文': 'en-US', '法文': 'fr-FR', '德文': 'de-DE', '西班牙文': 'es-ES', '日文': 'ja-JP', '韓文': 'ko-KR', '越南文': 'vi-VN', '印尼文': 'id-ID', '泰文': 'th-TH'};

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = speed;
        utterance.lang = langMap[language] || 'zh-TW';
        
        utterance.onend = () => {
          btn.innerHTML = originalHtml;
          lucide.createIcons();
          btn.disabled = false;
        };
        utterance.onerror = () => {
          btn.innerHTML = originalHtml;
          lucide.createIcons();
          btn.disabled = false;
        };

        window.speechSynthesis.speak(utterance);
      } catch (e) {
        alert("測試語音失敗，請稍後再試。");
        btn.innerHTML = originalHtml;
        lucide.createIcons();
        btn.disabled = false;
      }
    }

    // AI 自動生成情境
    async function autoGenerateScenario() {
      const btn = dom.btnAutoGenerate;
      const originalHtml = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 mr-1 animate-spin"></i> 生成中...`;
      lucide.createIcons();
      btn.disabled = true;

      try {
        const name = dom.editName.value.trim() || '未命名';
        const gender = dom.editGender.value;
        const age = dom.editAge.value;
        const language = dom.editLanguage.value;
        
        const prompt = `請為醫學生看診模擬系統，產生一段約 50 字的虛擬病患情境設定。
病患資料：姓名 ${name}，性別 ${gender}，年齡 ${age}歲，使用語言：${language}。
請設計一個適合老人醫學（如初期失智症、譫妄或常見退化疾病）的行為與症狀描述。
只需要直接回覆情境內容，不需任何問候語或解釋。`;

        const textPayload = { contents: [{ role: "user", parts: [{ text: prompt }] }] };
        
        // 修正：更換為公開穩定版的 gemini-2.5-flash 模型
        const textResult = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(textPayload)
        });

        const aiText = textResult.candidates?.[0]?.content?.parts?.[0]?.text;
        if(aiText) {
          dom.editScenario.value = aiText.trim();
        }
      } catch(e) {
        alert("生成情境失敗，請稍後再試。");
      } finally {
        btn.innerHTML = originalHtml;
        lucide.createIcons();
        btn.disabled = false;
      }
    }

    // 啟動
    init();
  </script>
</body>
</html>
